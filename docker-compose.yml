version: '3.9'
services:
  proxmox-mcp:
    build:
      context: .
      dockerfile: services/proxmox-mcp/Dockerfile
    env_file:
      - .env.example
    ports:
      - "4010:4010"

  infra-runner:
    build:
      context: .
      dockerfile: services/infra-runner/Dockerfile
    env_file:
      - .env.example
    ports:
      - "4020:4020"
